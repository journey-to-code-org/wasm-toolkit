name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: make test
      - run: python3 tools/bundle.py
      - run: rustup target add wasm32-unknown-unknown && pip install pillow numpy
      - run: make test-engine
      - run: python3 tools/bundle.py engine
      - uses: actions/upload-artifact@v4
        with:
          name: shootout
          path: |
            web/
            build/shootout.html
            build/engine.html

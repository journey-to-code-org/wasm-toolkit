[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "A retro driving-game engine that plays whatever content pack it is given"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

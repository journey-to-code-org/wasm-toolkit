<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to the Shootout</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* 320x240 on a 4:3 screen: square pixels, scaled up without smoothing. */
  #stage { position: relative; width: min(100vw, 133.33vh); aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; touch-action: none; }
  /* Buttons for a screen with no keyboard, laid over the picture. They press the same keys, and
     only the ones the game can use just now are there. Tapping the picture is Enter. */
  #pad { display: none; }
  #pad button { position: absolute; width: 17%; height: 15%; border: 2px solid rgba(255, 255, 255, .55); border-radius: 12px; background: rgba(10, 12, 20, .42);
    color: inherit; font: inherit; font-size: clamp(11px, 3.6vw, 20px); font-weight: bold; text-shadow: 0 1px 2px #000;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #pad button.down { background: rgba(230, 184, 74, .8); color: #1a1408; text-shadow: none; }
  #pad button[hidden] { display: none; }
  #pad .back { left: 1.5%; top: 2%; width: 14%; height: 10%; }
  #pad .fresh { right: 1.5%; top: 2%; width: 26%; height: 10%; }
  #pad .help { right: 1.5%; top: 2%; width: 10%; height: 10%; }
  #pad .l1 { left: 1.5%; bottom: 2.5%; } #pad .l2 { left: 20%; bottom: 2.5%; }
  #pad .r1 { right: 1.5%; bottom: 2.5%; } #pad .r2 { right: 20%; bottom: 2.5%; } #pad .r3 { right: 1.5%; bottom: 20%; height: 11%; }
  #pad .gas { height: 24%; }
  @media (pointer: coarse) { #pad { display: block; } canvas { cursor: auto; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" aria-label="Road to the Shootout"></canvas>
  <div id="pad" aria-label="Controls">
    <button data-key="Escape" data-in="123" class="back">Back</button>
    <button data-key="KeyE" data-in="0" class="fresh">New game</button>
    <button data-key="ArrowLeft" data-in="3" class="l1" aria-label="Left">&#9664;</button>
    <button data-key="ArrowRight" data-in="3" class="l2" aria-label="Right">&#9654;</button>
    <button data-key="KeyQ" data-in="2" class="l1" aria-label="Shift down">&#9660;</button>
    <button data-key="KeyE" data-in="2" class="l2" aria-label="Shift up">Shift &#9650;</button>
    <button data-key="ArrowDown" data-in="3" class="r2">Brake</button>
    <button data-key="ArrowUp" data-in="23" class="r1 gas">Gas</button>
    <button data-key="KeyN" data-in="23" data-flag="1" class="r3" aria-label="Nitrous">N2O</button>
    <button data-key="KeyH" data-in="1" class="help" aria-label="Show what can be picked">?</button>
  </div>
</div>
<script type="module">
  import { boot } from "./wtk.js";
  // The engine, playing a pack. Another pack: engine.html?pack=mine.pack
  const pack = new URLSearchParams(location.search).get("pack") ?? "default.pack";
  // Other players are met in a room the parlor keeps, beside where it serves this page; "?rooms="
  // names another. "?name=" is what this player goes by; one is made up and kept otherwise.
  const asked = new URLSearchParams(location.search);
  let name = asked.get("name");
  try { name ??= localStorage.getItem("wtk:name"); name ??= `Racer ${1000 + Math.floor(Math.random() * 9000)}`; localStorage.setItem("wtk:name", name); } catch { name ??= "Racer"; }
  const rooms = new URL(asked.get("rooms") ?? "../meet/shootout", location.href);
  rooms.protocol = rooms.protocol === "https:" || rooms.protocol === "wss:" ? "wss:" : "ws:";
  const net = location.protocol === "file:" && !asked.get("rooms") ? null : { url: rooms.href, name };
  const game = await boot(document.getElementById("screen"), "engine.wasm", undefined, pack, net);
  const buttons = [...document.querySelectorAll("#pad button")];
  for (const b of buttons) {
    const send = (type) => window.dispatchEvent(new KeyboardEvent(type, { code: b.dataset.key }));
    b.release = () => { if (b.classList.contains("down")) { b.classList.remove("down"); send("keyup"); } };
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); b.setPointerCapture(e.pointerId); b.classList.add("down"); send("keydown"); });
    b.addEventListener("pointerup", b.release);
    b.addEventListener("pointercancel", b.release);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  // Show the buttons that fit what the game is doing; one that goes away lets go of its key.
  // A button with a flag is only there when the game says so: the nitrous one, when the car has a kit.
  let mode = -1, flags = -1;
  setInterval(() => {
    const now = game.wtk_mode ? game.wtk_mode() : 1, has = game.wtk_flags ? game.wtk_flags() : -1;
    if (now === mode && has === flags) return;
    [mode, flags] = [now, has];
    for (const b of buttons) { b.hidden = !b.dataset.in.includes(String(mode)) || (b.dataset.flag && has >= 0 && !(has & +b.dataset.flag)); if (b.hidden) b.release(); }
  }, 100);
</script>
</body>
</html>

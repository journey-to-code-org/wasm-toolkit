<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The workshop</title>
<style>
  :root { color-scheme: dark; --ink: #e8e4d8; --dim: #9a968a; --line: #3a3d4a; --panel: #171a24; --gold: #e6b84a; --bad: #ff7a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0e14; color: var(--ink); font: 15px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  h1 { font-size: 18px; margin: 0; color: var(--gold); letter-spacing: 1px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
  header .grow { flex: 1; }
  main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; padding: 16px 20px; max-width: 1200px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); padding: 14px; margin-bottom: 16px; }
  label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 13px; }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 8px; background: #0c0e14; color: var(--ink); border: 1px solid var(--line); font: inherit; }
  input[type=range] { width: 100%; }
  button, .button { padding: 7px 12px; background: #262a3a; color: var(--ink); border: 1px solid #50556a; font: inherit; cursor: pointer; }
  button:hover, .button:hover { background: #343a50; }
  button.main { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: bold; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--ink); font-size: 14px; }
  .hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
  .bad { color: var(--bad); }
  #cars { list-style: none; margin: 0 0 10px; padding: 0; }
  #cars button { width: 100%; text-align: left; margin-bottom: 4px; }
  #cars button[aria-current=true] { border-color: var(--gold); color: var(--gold); }
  .drop { border: 1px dashed #6a708a; padding: 12px; text-align: center; color: var(--dim); cursor: pointer; }
  .drop.over { border-color: var(--gold); color: var(--gold); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
  #view { width: 100%; max-width: 640px; aspect-ratio: 4 / 3; background: #000; }
  #side { background: repeating-conic-gradient(#23263a 0 25%, #1a1c2a 0 50%) 0 0 / 16px 16px; cursor: crosshair; }
  .swatch { display: inline-block; width: 22px; height: 22px; border: 1px solid #000; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>THE WORKSHOP</h1>
  <span id="packName"></span>
  <span class="grow"></span>
  <label class="button" style="margin:0;color:var(--ink)">Open a pack<input id="open" type="file" accept=".pack" hidden></label>
  <button id="fresh">Start over</button>
  <button id="play">Play it</button>
  <button id="save" class="main">Save the pack</button>
</header>
<main>
  <div>
    <section>
      <h2>Cars in this pack</h2>
      <ul id="cars"></ul>
      <div class="row"><button id="add">Add a car</button><button id="remove">Remove this one</button></div>
    </section>
    <section id="editor">
      <h2>This car</h2>
      <label for="name">Its name</label>
      <input id="name" type="text" maxlength="36">
      <label>Its picture, from the side, nose to the right</label>
      <div class="drop" id="dropSide" tabindex="0" role="button">Drop a PNG here, or click to choose<input id="fileSide" type="file" accept="image/*" hidden></div>
      <label>The same picture with the headlamps on (optional)</label>
      <div class="drop" id="dropLamps" tabindex="0" role="button">Drop a PNG here, or click to choose<input id="fileLamps" type="file" accept="image/*" hidden></div>
      <p class="hint">Use pictures that are yours to use. They stay in your browser until you save the pack.</p>
      <div id="fromPicture">
        <label for="width">How wide it is in the game, in pixels (the screen is 320)</label>
        <input id="width" type="number" min="16" max="320">
        <label class="check"><input id="corner" type="checkbox"> The corner's colour is background: make it clear</label>
      </div>
      <label for="ground">Where the tyres touch the ground: row <output id="groundOut"></output></label>
      <input id="ground" type="range" min="1" max="200">
      <label for="paint">Its paint</label>
      <div class="row"><select id="paint" style="flex:1"></select><span class="swatch" id="paintSwatch"></span></div>
      <div id="bodyBox">
        <label for="within">How much of the picture counts as paint</label>
        <input id="within" type="range" min="5" max="90" value="35">
      </div>
      <p class="hint" id="paintHint"></p>
      <label for="price">What one in fair shape costs in the paper (blank: never for sale)</label>
      <input id="price" type="number" min="1" max="99999">
      <label class="check"><input id="starts" type="checkbox"> A new game starts with this car</label>
    </section>
  </div>
  <div>
    <section>
      <h2>In the game</h2>
      <canvas id="view" width="320" height="240" aria-label="The car in the game"></canvas>
      <label class="check"><input id="lampsOn" type="checkbox"> Headlamps on</label>
      <p class="hint bad" id="problem"></p>
    </section>
    <section>
      <h2>The picture, as the game stores it</h2>
      <canvas id="side" aria-label="The car's picture. Click its bodywork to say which colour is the paint."></canvas>
      <p class="hint" id="sideHint"></p>
    </section>
  </div>
</main>
<script type="module">
import { RAMPS, CLEAR, parsePack, buildPack, picDecode, picEncode, toIndices, groundOf, slug, makeViewer } from "./pack.js";

const $ = (id) => document.getElementById(id);
const KEEP = "wtk:workshop:pack";
const viewer = await makeViewer(await (await fetch("engine.wasm")).arrayBuffer());
const pal = viewer.palette;
const css = (c) => `rgb(${c & 255},${(c >> 8) & 255},${(c >> 16) & 255})`;

let pack = null, current = null;
// The pictures dropped in this visit, by car, so they can be matched to the colours again when a
// setting changes: { side, lamps (ImageBitmaps), width, corner, body: [r, g, b] | null, within }.
const sources = new Map();

async function start(bytes) {
  pack = parsePack(bytes);
  sources.clear();
  current = pack.manifest.start.car ?? Object.keys(pack.manifest.cars)[0] ?? null;
  await refresh();
}

function keep() {
  try { localStorage.setItem(KEEP, btoa(Array.from(buildPack(pack), (b) => String.fromCharCode(b)).join(""))); } catch { /* too big, or a private window */ }
}

const car = () => pack.manifest.cars[current];

// A picture file drawn at the car's width, as RGBA.
function scaled(bitmap, width) {
  const w = Math.max(16, Math.min(320, width)), h = Math.max(1, Math.round(bitmap.height * w / bitmap.width));
  if (h > 200) throw new Error(`At ${w} wide the picture is ${h} tall; the room is 200. Make it narrower.`);
  const c = new OffscreenCanvas(w, h), g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = bitmap.width > w * 1.5;
  g.imageSmoothingQuality = "high";
  g.drawImage(bitmap, 0, 0, w, h);
  return { w, h, rgba: g.getImageData(0, 0, w, h).data };
}

// Match the dropped pictures to the game's colours again and put them in the pack.
function convert() {
  const src = sources.get(current), c = car();
  if (!src?.side) return;
  const options = (rgba) => ({
    clear: src.corner ? [rgba[0], rgba[1], rgba[2]] : null,
    body: src.body ? { rgb: src.body, within: src.within / 100 } : null,
  });
  const side = scaled(src.side, src.width);
  const done = toIndices(side.rgba, side.w, side.h, pal, options(side.rgba));
  src.rgba = side;
  src.painted = done.painted;
  pack.files.set(c.side, picEncode(side.w, side.h, done.ix));
  c.paint_ramps = src.body ? { mid: RAMPS[done.ramp] } : {};
  if (!src.body) delete c.paint;
  else c.paint ??= RAMPS[done.ramp];
  if (src.lamps) {
    const lit = scaled(src.lamps, src.width);
    c.side_lamps = `${current}-lamps.pic`;
    pack.files.set(c.side_lamps, picEncode(lit.w, lit.h, toIndices(lit.rgba, lit.w, lit.h, pal, options(lit.rgba)).ix));
  }
  if (!src.groundSet) c.ground = groundOf(side.w, side.h, done.ix);
}

async function refresh() {
  const m = pack.manifest;
  $("packName").textContent = m.name;
  $("cars").replaceChildren(...Object.entries(m.cars).map(([id, c]) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = c.name + (m.start.car === id ? "  (starts)" : "");
    b.setAttribute("aria-current", id === current);
    b.onclick = () => { current = id; refresh(); };
    li.append(b);
    return li;
  }));
  $("editor").hidden = !current;
  $("remove").disabled = !current;
  let shown = pack;
  if (current) {
    const c = car(), src = sources.get(current), pic = pack.files.get(c.side) && picDecode(pack.files.get(c.side));
    $("name").value = c.name;
    $("fromPicture").hidden = !src?.side;
    if (src?.side) { $("width").value = src.width; $("corner").checked = src.corner; $("within").value = src.within; }
    $("ground").max = pic ? pic.h : 200;
    $("ground").value = c.ground;
    $("groundOut").textContent = c.ground;
    const canPaint = !!c.paint_ramps?.mid;
    $("paint").replaceChildren(new Option("As painted", ""), ...RAMPS.slice(1).map((r) => new Option(r[0] + r.slice(1).toLowerCase(), r)));
    $("paint").value = canPaint ? c.paint ?? "" : "";
    $("paint").disabled = !canPaint;
    $("paintSwatch").style.background = canPaint && c.paint ? css(pal[RAMPS.indexOf(c.paint) * 32 + 20]) : "transparent";
    $("bodyBox").hidden = !src?.body;
    $("paintHint").textContent = canPaint
      ? src?.body ? `${src.painted} pixels count as paint. Click the picture again to pick a different colour.` : "This picture's paint can be shown in any colour."
      : src?.side ? "To show this car in other colours, click its bodywork in the picture." : "Drop the picture in again to say which part of it is paint.";
    $("price").value = c.price ?? "";
    $("starts").checked = m.start.car === current;
    drawSide(pic, c);
    shown = { manifest: { ...m, start: { ...m.start, car: current } }, files: pack.files };
  } else drawSide(null);
  const place = m.places[m.start.place];
  const spot = place?.spots?.find((s) => s.do === "lamps")?.rect ?? null;
  const { ok, rgba } = await viewer.view(buildPack(shown), { lamps: $("lampsOn").checked, spot });
  $("view").getContext("2d").putImageData(new ImageData(rgba, 320, 240), 0, 0);
  $("problem").textContent = ok ? "" : "The engine will not play this pack as it stands; the screen says why.";
  keep();
}

function drawSide(pic, c) {
  const canvas = $("side"), zoom = 2;
  if (!pic) { canvas.width = canvas.height = 1; $("sideHint").textContent = "No picture yet."; return; }
  canvas.width = pic.w; canvas.height = pic.h + 2;
  canvas.style.width = pic.w * zoom + "px";
  const g = canvas.getContext("2d"), image = g.createImageData(pic.w, pic.h), out = new Uint32Array(image.data.buffer);
  pic.ix.forEach((v, i) => { out[i] = v === CLEAR ? 0 : pal[v]; });
  g.putImageData(image, 0, 0);
  g.fillStyle = "#ff4d6a";
  g.fillRect(0, c.ground, pic.w, 1);
  const colours = new Set(pic.ix).size - 1;
  $("sideHint").textContent = `${pic.w} x ${pic.h}, ${colours} colours. The red line is the ground.`;
}

async function dropped(file, which) {
  if (!file || !current) return;
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch { return fail("That file is not a picture the browser can read."); }
  const src = sources.get(current) ?? { width: Math.min(bitmap.width, 244), corner: false, body: null, within: 35 };
  if (which === "side") { src.side = bitmap; src.width = Math.min(bitmap.width, bitmap.width > 320 ? 244 : 320); src.body = null; src.groundSet = false; }
  else if (!src.side) return fail("Give the car its ordinary picture first.");
  else src.lamps = bitmap;
  sources.set(current, src);
  change(() => {});
}

function fail(why) { $("problem").textContent = why; }

// Make a change, match the pictures again, and show it. A change that cannot be made is undone.
function change(make) {
  const before = JSON.stringify(pack.manifest), src = sources.get(current), was = src && { ...src };
  try { make(); convert(); } catch (e) {
    pack.manifest = JSON.parse(before);
    if (src) Object.assign(src, was);
    refresh().then(() => fail(e.message));
    return;
  }
  refresh();
}

for (const [zone, input, which] of [["dropSide", "fileSide", "side"], ["dropLamps", "fileLamps", "lamps"]]) {
  const z = $(zone), f = $(input);
  z.onclick = () => f.click();
  z.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f.click(); } };
  f.onchange = () => { dropped(f.files[0], which); f.value = ""; };
  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = (e) => { e.preventDefault(); z.classList.remove("over"); dropped(e.dataTransfer.files[0], which); };
}

$("name").oninput = () => { car().name = $("name").value; keep(); };
$("name").onchange = () => {
  // A car added here is filed under its name once it has one.
  const cars = pack.manifest.cars, c = car();
  if (current.startsWith("new-car") && c.name.trim()) {
    let id = slug(c.name);
    for (let n = 2; cars[id]; n++) id = `${slug(c.name)}-${n}`;
    const move = (from, to) => { pack.files.set(to, pack.files.get(from)); pack.files.delete(from); return to; };
    c.side = move(c.side, `${id}.pic`);
    if (c.side_lamps) c.side_lamps = move(c.side_lamps, `${id}-lamps.pic`);
    cars[id] = c;
    delete cars[current];
    if (sources.has(current)) { sources.set(id, sources.get(current)); sources.delete(current); }
    if (pack.manifest.start.car === current) pack.manifest.start.car = id;
    current = id;
  }
  refresh();
};
$("width").onchange = () => change(() => { const s = sources.get(current); s.width = +$("width").value || s.width; s.groundSet = false; });
$("corner").onchange = () => change(() => { sources.get(current).corner = $("corner").checked; });
$("within").onchange = () => change(() => { sources.get(current).within = +$("within").value; });
$("ground").oninput = () => { car().ground = +$("ground").value; const s = sources.get(current); if (s) s.groundSet = true; refresh(); };
$("paint").onchange = () => { if ($("paint").value) car().paint = $("paint").value; else delete car().paint; refresh(); };
$("price").onchange = () => { const v = Math.floor(+$("price").value); if (v > 0) car().price = v; else delete car().price; refresh(); };
$("starts").onchange = () => {
  if ($("starts").checked) pack.manifest.start.car = current; else delete pack.manifest.start.car;
  refresh();
};
$("lampsOn").onchange = () => refresh();
$("side").onclick = (e) => {
  const src = sources.get(current);
  if (!src?.rgba) return;
  const r = $("side").getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * src.rgba.w), y = Math.floor((e.clientY - r.top) / r.height * (src.rgba.h + 2));
  if (y >= src.rgba.h) return;
  const i = (y * src.rgba.w + x) * 4;
  if (src.rgba.rgba[i + 3] < 128) return;
  change(() => { src.body = [src.rgba.rgba[i], src.rgba.rgba[i + 1], src.rgba.rgba[i + 2]]; });
};

$("add").onclick = () => {
  const cars = pack.manifest.cars;
  let id = "new-car";
  for (let n = 2; cars[id]; n++) id = `new-car-${n}`;
  // A new car borrows the first car's picture until it is given its own.
  const like = Object.values(cars)[0];
  if (like) { pack.files.set(`${id}.pic`, pack.files.get(like.side)); cars[id] = { name: "New car", side: `${id}.pic`, ground: like.ground, paint: like.paint, paint_ramps: like.paint_ramps, price: like.price, drive: like.drive }; if (!like.drive) delete cars[id].drive; }
  else { pack.files.set(`${id}.pic`, picEncode(1, 1, new Uint16Array([CLEAR]))); cars[id] = { name: "New car", side: `${id}.pic`, ground: 1 }; }
  if (!cars[id].paint) delete cars[id].paint;
  current = id;
  refresh().then(() => $("name").select());
};
$("remove").onclick = () => {
  const m = pack.manifest, c = car();
  if (!confirm(`Remove ${c.name} from the pack?`)) return;
  pack.files.delete(c.side);
  if (c.side_lamps) pack.files.delete(c.side_lamps);
  delete m.cars[current];
  sources.delete(current);
  if (m.start.car === current) delete m.start.car;
  current = m.start.car ?? Object.keys(m.cars)[0] ?? null;
  refresh();
};

$("open").onchange = async () => {
  const f = $("open").files[0];
  if (!f) return;
  try { await start(new Uint8Array(await f.arrayBuffer())); } catch (e) { fail(e.message); }
  $("open").value = "";
};
$("fresh").onclick = async () => {
  if (!confirm("Throw away the changes and go back to the default pack?")) return;
  localStorage.removeItem(KEEP);
  await start(new Uint8Array(await (await fetch("default.pack")).arrayBuffer()));
};
const blob = () => new Blob([buildPack(pack)], { type: "application/octet-stream" });
$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob());
  a.download = slug(pack.manifest.name) + ".pack";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// The game opens in its own tab and reads the pack from this one, so keep this tab open.
$("play").onclick = () => window.open("engine.html?pack=" + encodeURIComponent(URL.createObjectURL(blob())));

let kept = null;
try { kept = Uint8Array.from(atob(localStorage.getItem(KEEP) ?? ""), (ch) => ch.charCodeAt(0)); } catch { /* nothing kept */ }
try { if (!kept?.length) throw 0; await start(kept); } catch { await start(new Uint8Array(await (await fetch("default.pack")).arrayBuffer())); }
</script>
</body>
</html>

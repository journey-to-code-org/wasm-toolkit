<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The workshop</title>
<style>
  :root { color-scheme: dark; --ink: #e8e4d8; --dim: #9a968a; --line: #3a3d4a; --panel: #171a24; --gold: #e6b84a; --bad: #ff7a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0e14; color: var(--ink); font: 15px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  h1 { font-size: 18px; margin: 0; color: var(--gold); letter-spacing: 1px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
  header .grow { flex: 1; }
  main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; padding: 16px 20px; max-width: 1200px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); padding: 14px; margin-bottom: 16px; }
  label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 13px; }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 8px; background: #0c0e14; color: var(--ink); border: 1px solid var(--line); font: inherit; }
  input[type=range] { width: 100%; }
  button, .button { padding: 7px 12px; background: #262a3a; color: var(--ink); border: 1px solid #50556a; font: inherit; cursor: pointer; }
  button:hover, .button:hover { background: #343a50; }
  button.main { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: bold; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--ink); font-size: 14px; }
  .hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
  .bad { color: var(--bad); }
    .drop { border: 1px dashed #6a708a; padding: 12px; text-align: center; color: var(--dim); cursor: pointer; }
  .drop.over { border-color: var(--gold); color: var(--gold); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
  #view { width: 100%; max-width: 640px; aspect-ratio: 4 / 3; background: #000; }
  #side { background: repeating-conic-gradient(#23263a 0 25%, #1a1c2a 0 50%) 0 0 / 16px 16px; cursor: crosshair; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); }
  nav button { border-bottom: none; padding: 8px 16px; }
  nav button[aria-selected=true] { background: var(--panel); color: var(--gold); border-color: var(--gold); }
  .list { list-style: none; margin: 0 0 10px; padding: 0; }
  .list button { width: 100%; text-align: left; margin-bottom: 4px; }
  .list button[aria-current=true] { border-color: var(--gold); color: var(--gold); }
  .stage { position: relative; width: 100%; max-width: 640px; }
  .stage canvas.over { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .card { border: 1px solid var(--line); padding: 10px; margin-bottom: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
  textarea { width: 100%; min-height: 110px; padding: 7px 8px; background: #0c0e14; color: var(--ink); border: 1px solid var(--line); font: inherit; }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--gold); }
  [hidden] { display: none !important; }
  .swatch { display: inline-block; width: 22px; height: 22px; border: 1px solid #000; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>THE WORKSHOP</h1>
  <span id="packName"></span>
  <span class="grow"></span>
  <label class="button" style="margin:0;color:var(--ink)">Open a pack<input id="open" type="file" accept=".pack" hidden></label>
  <button id="fresh">Start over</button>
  <button id="play">Play it</button>
  <button id="save" class="main">Save the pack</button>
  <button id="publish" class="main" hidden>Publish it</button>
</header>
<p id="published" class="hint" role="status" style="margin:6px 20px 0"></p>
<nav id="tabs" role="tablist" aria-label="What to work on"></nav>
<main>
  <div id="panel"></div>
  <div>
    <section>
      <h2 id="viewTitle">In the game</h2>
      <div class="stage"><canvas id="view" width="320" height="240" aria-label="The game, as the engine draws it"></canvas><canvas id="viewOver" class="over" width="640" height="480" hidden></canvas></div>
      <label class="check" id="lampsBox"><input id="lampsOn" type="checkbox"> Headlamps on</label>
      <p class="hint" id="viewHint"></p>
      <p class="hint bad" id="problem" role="status"></p>
    </section>
    <section id="mapBox">
      <h2>The map, from above</h2>
      <canvas id="mapView" aria-label="The map. Click or drag to put down the kind of block that is picked." style="cursor:crosshair;touch-action:none"></canvas>
    </section>
    <section id="sideBox">
      <h2>The picture, as the game stores it</h2>
      <canvas id="side" aria-label="The car's picture. Click its bodywork to say which colour is the paint."></canvas>
      <p class="hint" id="sideHint"></p>
    </section>
    <section id="hoodBox">
      <h2>Under its hood</h2>
      <div class="stage"><canvas id="hood" aria-label="The engine bay"></canvas><canvas id="hoodOver" class="over"></canvas></div>
      <p class="hint">Drag a box to move it, or its corner to size it. Each box is where one slot's part sits.</p>
    </section>
  </div>
</main>
<script type="module" src="workshop.js"></script>
</body>
</html>
